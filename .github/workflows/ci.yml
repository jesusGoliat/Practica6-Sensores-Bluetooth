name: CI Android

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paquetes:
    name: Paquete ${{ matrix.paquete }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paquete: [comun, sensores, enlace_ble, consulta_web]
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que el paquete existe
        id: existe
        run: |
          if [ -d "packages/${{ matrix.paquete }}" ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::packages/${{ matrix.paquete }} aún no existe; se omite."
          fi
      - uses: subosito/flutter-action@v2
        if: steps.existe.outputs.existe == 'true'
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Dependencias
        if: steps.existe.outputs.existe == 'true'
        working-directory: packages/${{ matrix.paquete }}
        run: flutter pub get
      - name: Análisis estático
        if: steps.existe.outputs.existe == 'true'
        working-directory: packages/${{ matrix.paquete }}
        run: flutter analyze
      - name: Pruebas
        if: steps.existe.outputs.existe == 'true'
        working-directory: packages/${{ matrix.paquete }}
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Sin directorio test/; se omite."
          fi

  apps:
    name: Android ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [gestor_archivos, juego_pares]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Dependencias
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Análisis estático
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze
      - name: Pruebas
        working-directory: apps/${{ matrix.app }}
        run: flutter test
      - name: APK release
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: p6-${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
