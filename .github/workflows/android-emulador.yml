name: Android emulador (evidencia de respaldo)

# Se ejecuta manualmente desde Actions. Es un respaldo para cuando no hay un
# celular físico disponible; la evidencia principal se toma en dispositivo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidencia:
    name: Android ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [gestor_archivos, juego_pares]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Dependencias
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Ejecutar en emulador y capturar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd apps/${{ matrix.app }}
            rm -rf screenshots
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/evidencia_ios_test.dart \
              -d emulator-5554
            mkdir -p "$GITHUB_WORKSPACE/evidencia/${{ matrix.app }}"
            cp screenshots/*.png "$GITHUB_WORKSPACE/evidencia/${{ matrix.app }}/"
      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulador-${{ matrix.app }}
          if-no-files-found: warn
          path: evidencia/${{ matrix.app }}
