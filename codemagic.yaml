  ios-paquetes:
    name: iOS paquetes — analyze y test
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.47.6
    scripts:
      - name: Analyze y test de sensores y enlace_ble
        script: |
          for p in sensores enlace_ble; do
            if [ -d "packages/$p" ]; then
              (cd "packages/$p" && flutter pub get && flutter analyze && flutter test)
            else
              echo "packages/$p no existe; se omite."
            fi
          done
